name: Full Chromium Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - pgo
  push:
    branches:
      - main
    paths:
      - '.github/full-build-request'

permissions:
  contents: read

concurrency:
  group: nautrix-full-chromium-build
  cancel-in-progress: true

env:
  BUILD_VARIANT: ${{ inputs.variant || 'baseline' }}

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, nautrix-chromium]
    timeout-minutes: 720
    steps:
      - name: Checkout Nautrix
        uses: actions/checkout@v5
        with:
          # Chromium's checkout and build outputs are intentionally ignored and
          # reused by this dedicated runner between baseline and PGO runs.
          clean: false

      - name: Confirm requested revision
        shell: pwsh
        run: |
          Write-Host "[Nautrix] Building repository commit $env:GITHUB_SHA"
          Write-Host "[Nautrix] Variant: $env:BUILD_VARIANT"
          Get-Content .github/full-build-request -ErrorAction SilentlyContinue

      - name: Build native tools
        shell: cmd
        run: tools\build_launcher.cmd

      - name: Build Chromium baseline
        if: ${{ env.BUILD_VARIANT == 'baseline' }}
        shell: cmd
        run: tools\build_chromium.cmd

      - name: Build Chromium PGO
        if: ${{ env.BUILD_VARIANT == 'pgo' }}
        shell: cmd
        run: tools\build_chromium_pgo.cmd

      - name: Runtime smoke baseline
        if: ${{ env.BUILD_VARIANT == 'baseline' }}
        shell: pwsh
        run: >-
          ./tools/runtime_smoke.ps1
          -Browser "$PWD/.chromium-work/src/out/Nautrix/chrome.exe"
          -Launcher "$PWD/.launcher-build/Release/NautrixLauncher.exe"
          -ConfigDir "$PWD/config"

      - name: Runtime smoke PGO
        if: ${{ env.BUILD_VARIANT == 'pgo' }}
        shell: pwsh
        run: >-
          ./tools/runtime_smoke.ps1
          -Browser "$PWD/.chromium-work/src/out/NautrixPGO/chrome.exe"
          -Launcher "$PWD/.launcher-build/Release/NautrixLauncher.exe"
          -ConfigDir "$PWD/config"

      - name: Package deliverables
        shell: pwsh
        run: |
          $variant = $env:BUILD_VARIANT
          $out = if ($variant -eq 'pgo') { '.chromium-work/src/out/NautrixPGO' } else { '.chromium-work/src/out/Nautrix' }
          $package = "dist/Nautrix-$variant-x64-test"
          if (Test-Path -LiteralPath $package) {
            Remove-Item -LiteralPath $package -Recurse -Force
          }
          ./tools/package_test_installer.ps1 `
            -Variant $variant `
            -ChromiumOutput $out `
            -OutputDir $package
          ./tools/verify_test_package.ps1 `
            -PackageDir $package

      - name: Install, launch, and uninstall test package
        shell: pwsh
        run: |
          $package = "dist/Nautrix-$env:BUILD_VARIANT-x64-test"
          ./tools/install_test_package.ps1 -PackageDir $package -UninstallAfterTest

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Nautrix-${{ env.BUILD_VARIANT }}-x64
          path: dist/Nautrix-${{ env.BUILD_VARIANT }}-x64-test/
          compression-level: 6
          if-no-files-found: error
