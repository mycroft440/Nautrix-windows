name: Full Chromium Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/full-chromium-build.yml'
      - 'chromium/**'
      - 'launcher/**'
      - 'config/**'
      - 'installer/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - pgo

permissions:
  actions: write
  contents: read

concurrency:
  group: full-chromium-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supersede-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale runs and verify the runner readiness gate
        uses: actions/github-script@v9
        env:
          NAUTRIX_FULL_BUILD_RUNNER_READY: ${{ vars.NAUTRIX_FULL_BUILD_RUNNER_READY }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const currentSha = context.sha;
            const branch = context.ref.startsWith('refs/heads/')
              ? context.ref.substring('refs/heads/'.length)
              : undefined;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'full-chromium-build.yml',
                branch,
                per_page: 100,
              }
            );

            for (const run of runs) {
              if (run.id === currentRunId || run.head_sha === currentSha) continue;
              if (!['queued', 'in_progress', 'pending', 'waiting', 'requested'].includes(run.status)) continue;

              core.info(`Canceling stale Full Chromium Build #${run.run_number} (${run.id}) at ${run.head_sha}`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              } catch (error) {
                if (error.status === 409) {
                  core.info(`Run ${run.id} is no longer cancelable; continuing.`);
                  continue;
                }
                throw error;
              }
            }

            const requiredLabels = ['self-hosted', 'windows', 'x64', 'nautrix-chromium'];
            const runnerReady =
              (process.env.NAUTRIX_FULL_BUILD_RUNNER_READY || '').toLowerCase() === 'true';
            if (!runnerReady) {
              core.setFailed(
                `The NAUTRIX_FULL_BUILD_RUNNER_READY repository variable is not true. ` +
                `Run Setup-Nautrix-Runner.cmd on the Windows build machine; it verifies the online runner ` +
                `with labels (${requiredLabels.join(', ')}) before enabling this gate.`
              );
            } else {
              core.info(
                `Runner readiness gate is enabled for labels: ${requiredLabels.join(', ')}.`
              );
            }

  build:
    needs: supersede-stale
    runs-on: [self-hosted, Windows, X64, nautrix-chromium]
    timeout-minutes: 720
    env:
      BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'baseline' }}
    steps:
      - name: Checkout Nautrix
        uses: actions/checkout@v5
        with:
          # Chromium's checkout and build outputs are intentionally ignored and
          # reused by this dedicated runner between baseline and PGO runs.
          clean: false

      - name: Build native tools
        shell: cmd
        run: tools\build_launcher.cmd

      - name: Build Chromium baseline
        if: ${{ env.BUILD_VARIANT == 'baseline' }}
        shell: cmd
        run: tools\build_chromium.cmd

      - name: Build Chromium PGO
        if: ${{ env.BUILD_VARIANT == 'pgo' }}
        shell: cmd
        run: tools\build_chromium_pgo.cmd

      - name: Runtime smoke baseline
        if: ${{ env.BUILD_VARIANT == 'baseline' }}
        shell: pwsh
        run: >-
          ./tools/runtime_smoke.ps1
          -Browser "$PWD/.chromium-work/src/out/Nautrix/chrome.exe"
          -Launcher "$PWD/.launcher-build/Release/NautrixLauncher.exe"
          -ConfigDir "$PWD/config"

      - name: Runtime smoke PGO
        if: ${{ env.BUILD_VARIANT == 'pgo' }}
        shell: pwsh
        run: >-
          ./tools/runtime_smoke.ps1
          -Browser "$PWD/.chromium-work/src/out/NautrixPGO/chrome.exe"
          -Launcher "$PWD/.launcher-build/Release/NautrixLauncher.exe"
          -ConfigDir "$PWD/config"

      - name: Package deliverables
        shell: pwsh
        run: |
          $out = if ($env:BUILD_VARIANT -eq 'pgo') { '.chromium-work/src/out/NautrixPGO' } else { '.chromium-work/src/out/Nautrix' }
          $package = "dist/Nautrix-$env:BUILD_VARIANT-x64-test"
          if (Test-Path -LiteralPath $package) {
            Remove-Item -LiteralPath $package -Recurse -Force
          }
          ./tools/package_test_installer.ps1 `
            -Variant $env:BUILD_VARIANT `
            -ChromiumOutput $out `
            -OutputDir $package
          ./tools/verify_test_package.ps1 `
            -PackageDir $package

      - name: Install, launch, and uninstall test package
        shell: pwsh
        run: >-
          ./tools/install_test_package.ps1
          -PackageDir "dist/Nautrix-$env:BUILD_VARIANT-x64-test"
          -UninstallAfterTest

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Nautrix-${{ env.BUILD_VARIANT }}-x64
          path: dist/Nautrix-${{ env.BUILD_VARIANT }}-x64-test/
          compression-level: 6
          if-no-files-found: error
