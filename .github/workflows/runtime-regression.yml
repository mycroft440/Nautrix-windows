name: Runtime Regression

on:
  workflow_dispatch:
    inputs:
      browser_path:
        description: Absolute path to an already-built chrome.exe on the self-hosted runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, Windows, X64, nautrix-chromium]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Build native tools
        shell: cmd
        run: tools\build_launcher.cmd
      - name: Runtime smoke and DNS benchmark
        shell: pwsh
        run: >-
          ./tools/runtime_smoke.ps1
          -Browser "${{ inputs.browser_path }}"
          -Launcher "$PWD/.launcher-build/Release/NautrixLauncher.exe"
          -ConfigDir "$PWD/config"
      - name: Chromium network/NetLog probes
        shell: pwsh
        run: ./tools/chromium_network_probe.ps1 -Browser "${{ inputs.browser_path }}"
      - name: Navigation regression
        shell: pwsh
        run: ./tools/benchmark_navigation.ps1 -Browser "${{ inputs.browser_path }}" -Runs 5
      - name: CPU RAM process-tree profile
        shell: pwsh
        run: ./tools/profile_browser.ps1 -Browser "${{ inputs.browser_path }}" -Seconds 30
      - name: Upload measurements
        uses: actions/upload-artifact@v7
        with:
          name: Nautrix-runtime-regression
          path: ~/AppData/Local/Nautrix/
          if-no-files-found: error
