name: Build Windows

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap WebView2 SDK
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Nautrix-Windows-x64-${{ matrix.configuration }}
          path: build/${{ matrix.configuration }}/Nautrix.exe
          if-no-files-found: error
