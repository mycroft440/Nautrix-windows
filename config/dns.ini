# Nautrix browser-local DNS configuration.
# mode: automatic | manual | system
mode=automatic
prefer_encrypted=1

# Automatic selection: real DNS query samples, not ICMP ping.
samples=5
timeout_ms=700
retest_minutes=30
minimum_improvement_percent=12

# DNS domains used to score resolver response quality.
probe_domains=example.com,cloudflare.com,microsoft.com,google.com,www.mexc.com,api.mexc.com

# Priority/trading hosts: after resolving each through a candidate resolver,
# Nautrix also measures TCP/443 connection setup to the returned IPv4 route.
# This avoids selecting a DNS solely because it answers quickly while returning
# a slower CDN/edge route for the sites that matter most.
priority_hosts=www.mexc.com,api.mexc.com
connect_timeout_ms=800
connect_samples=1
connect_weight=0.35

# Manual mode values.
manual_nameservers=1.1.1.1,1.0.0.1
manual_doh_template=https://cloudflare-dns.com/dns-query

# provider=id|comma-separated IPs|DoH template
provider=cloudflare|1.1.1.1,1.0.0.1|https://cloudflare-dns.com/dns-query
provider=google|8.8.8.8,8.8.4.4|https://dns.google/dns-query
provider=quad9|9.9.9.9,149.112.112.112|https://dns.quad9.net/dns-query
provider=adguard|94.140.14.14,94.140.15.15|https://dns.adguard-dns.com/dns-query
