# Nautrix browser-local DNS configuration.
# mode: automatic | manual | system
mode=automatic
prefer_encrypted=1

# Automatic selection uses real DNS + DoH + route measurements.
samples=6
timeout_ms=700
retest_minutes=30
minimum_improvement_percent=12
doh_samples=2
doh_weight=0.55

# Probe normal web names plus the low-latency trading set so the winner is not
# selected from a synthetic ping alone.
probe_domains=example.com,cloudflare.com,microsoft.com,google.com,www.mexc.com,api.mexc.com,www.binance.com,api.binance.com,www.bybit.com,api.bybit.com,www.okx.com,www.kraken.com,api.kraken.com,www.coinbase.com,api.coinbase.com,www.tradingview.com
priority_hosts=www.mexc.com,api.mexc.com,www.binance.com,api.binance.com,www.bybit.com,api.bybit.com,www.okx.com,www.kraken.com,api.kraken.com,www.coinbase.com,api.coinbase.com,www.tradingview.com
connect_timeout_ms=800
connect_samples=1
connect_weight=0.40

# Manual mode.
manual_nameservers=1.1.1.1,1.0.0.1
manual_doh_template=https://cloudflare-dns.com/dns-query

# provider=id|comma-separated IPv4/IPv6 resolver IPs|DoH endpoint
provider=cloudflare|1.1.1.1,1.0.0.1,2606:4700:4700::1111,2606:4700:4700::1001|https://cloudflare-dns.com/dns-query
provider=google|8.8.8.8,8.8.4.4,2001:4860:4860::8888,2001:4860:4860::8844|https://dns.google/dns-query
provider=quad9|9.9.9.9,149.112.112.112,2620:fe::fe,2620:fe::9|https://dns.quad9.net/dns-query
provider=adguard|94.140.14.14,94.140.15.15,2a10:50c0::ad1:ff,2a10:50c0::ad2:ff|https://dns.adguard-dns.com/dns-query
