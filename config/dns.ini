# Nautrix browser-local DNS configuration.
# mode: automatic | manual | system
mode=automatic
prefer_encrypted=1

# Automatic selection: real DNS query samples, not ICMP ping.
samples=5
timeout_ms=700
retest_minutes=30
minimum_improvement_percent=12

# Add the domains that matter most to your workload/trading sites here.
probe_domains=example.com,cloudflare.com,microsoft.com,google.com

# Manual mode values.
manual_nameservers=1.1.1.1,1.0.0.1
manual_doh_template=https://cloudflare-dns.com/dns-query

# provider=id|comma-separated IPs|DoH template
provider=cloudflare|1.1.1.1,1.0.0.1|https://cloudflare-dns.com/dns-query
provider=google|8.8.8.8,8.8.4.4|https://dns.google/dns-query
provider=quad9|9.9.9.9,149.112.112.112|https://dns.quad9.net/dns-query
provider=adguard|94.140.14.14,94.140.15.15|https://dns.adguard-dns.com/dns-query
