# Nautrix low-latency browser profile. Every switch is measurable/reversible.
# trading_mode: automatic | normal | aggressive
# - automatic: aggressive only for configured trading origins.
# - normal: standard Chromium scheduling/network priorities.
# - aggressive: low-latency policy for every site in the current browser process.
trading_mode=automatic

enable_happy_eyeballs_v3=1
enable_priority_preconnect=1
enable_quic=1

# Resource-efficiency policy. Chromium's own Performance Manager remains in
# charge of discard/freeze decisions; Nautrix only selects conservative defaults.
enable_memory_saver=1
memory_saver_aggressiveness=medium
memory_saver_discard_minutes=120

# Persistent connection warming is bounded. Origins after the preconnect budget
# are warmed only by Chromium/Nautrix navigation intent instead of permanently.
enable_connection_keepalive=1
preconnect_max_origins=4
keepalive_max_origins=2
keepalive_idle_seconds=120
keepalive_ping_seconds=25

# Selective latency policy. In automatic mode these only apply to trading_sites.
enable_network_priority_boost=1
enable_selective_throttling_bypass=1
# Hidden trading pages retain the bypass only while Blink reports an active
# connection; idle hidden pages fall back to upstream background throttling.
enable_background_connection_bypass=1
enable_intent_preconnect=1

# Lifecycle/Windows scheduler controls. Chromium already protects visible/recent
# tabs. Managed discard/freezing exceptions are intentionally restricted to the
# optional critical_trading_sites list instead of every trading domain.
enable_high_resolution_timer=1
enable_freezing_protection=1
enable_trading_process_priority=1
disable_ecoqos_for_trading=1
critical_trading_sites=

# Chromium already maintains a reusable spare RenderProcessHost. Nautrix can
# request a warm spare only when a trading navigation is imminent; it does not
# maintain an oversized permanent renderer pool.
enable_spare_renderer_warmup=1

# Experimental features are opt-in A/B switches so regressions can be measured.
# accepted values: off | on | ab
optimistic_dns_for_tcp=ab
websocket_over_http3=ab

# Chromium already enables HTTPS/SVCB on this pinned revision; keep it enabled.
enable_https_svcb=1

# Preserve Chromium's own cache sizing and speculation heuristics. Nautrix does
# not force --disk-cache-size and does not add a global prerender policy.
use_chromium_default_disk_cache=1
allow_custom_global_prerender=0

# Optional lightweight declarative blocker. It ships as a no-background-process
# MV3 ruleset and remains A/B/off until runtime measurements prove a net win.
# accepted values: off | on | ab
lightweight_blocker=ab

# Capture is off during normal browsing; enable on demand for profiling.
enable_netlog=0
enable_startup_trace=0

# Raise only the browser root process one class; matching renderers/workers use
# Chromium's foreground-priority path. Never use HIGH/REALTIME by default.
process_priority=above_normal

# Read-only Windows/NIC diagnostics. Nautrix never silently changes adapter settings.
enable_windows_nic_diagnostics=1

# Record tail latency, not only averages.
metrics_percentiles=p50,p95,p99

# Persistent warm-origin order is deliberate: primary trading UI/API and charting
# paths come first, while the bounded budget prevents warming every exchange.
preconnect_origins=https://www.mexc.com,https://api.mexc.com,https://www.tradingview.com,https://www.binance.com,https://api.binance.com,https://www.bybit.com,https://api.bybit.com,https://www.okx.com,https://www.kraken.com,https://api.kraken.com,https://www.coinbase.com,https://api.coinbase.com
trading_sites=mexc.com,binance.com,bybit.com,okx.com,kraken.com,coinbase.com,tradingview.com
