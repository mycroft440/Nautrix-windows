# Nautrix low-latency policy. Experimental features remain A/B until runtime data proves a win.
trading_mode=automatic
enable_happy_eyeballs_v3=0
happy_eyeballs_v3=ab-network
enable_priority_preconnect=1
enable_quic=1
enable_connection_keepalive=1
adaptive_keepalive=1
keepalive_idle_seconds=120
keepalive_ping_seconds=25
keepalive_active_idle_seconds=180
keepalive_active_ping_seconds=20
keepalive_background_idle_seconds=45
keepalive_background_ping_seconds=0
enable_network_priority_boost=1
request_priority_policy=critical
enable_selective_throttling_bypass=1
enable_intent_preconnect=1
intent_preconnect_hover_ms=120
intent_preconnect_pointerdown=1
intent_preconnect_tab_activation=1
enable_high_resolution_timer=1
enable_freezing_protection=1
enable_trading_process_priority=1
disable_ecoqos_for_trading=1
enable_spare_renderer_warmup=1
optimistic_dns_for_tcp=ab-network
websocket_over_http3=ab-origin
websocket_h3_origins=mexc.com,binance.com,bybit.com,okx.com,kraken.com,coinbase.com,tradingview.com
https_svcb_priority=ab-network
enable_https_svcb=1
tcp_iocp_windows=ab-machine
enable_origin_dns_router=1
origin_dns_router_port=53
origin_route_learning=1
origin_route_ttl_minutes=30
origin_route_hysteresis_percent=8
origin_route_sites=mexc.com,binance.com,bybit.com,okx.com,kraken.com,coinbase.com,tradingview.com
enable_v8_latency_telemetry=1
enable_input_to_frame_telemetry=1
enable_trading_steady_state_benchmark=1
enable_netlog=0
enable_startup_trace=0
process_priority=above_normal
enable_windows_nic_diagnostics=1
metrics_percentiles=p50,p95,p99
preconnect_origins=https://www.mexc.com,https://api.mexc.com,https://www.binance.com,https://api.binance.com,https://www.bybit.com,https://api.bybit.com,https://www.okx.com,https://www.kraken.com,https://api.kraken.com,https://www.coinbase.com,https://api.coinbase.com,https://www.tradingview.com
trading_sites=mexc.com,binance.com,bybit.com,okx.com,kraken.com,coinbase.com,tradingview.com
