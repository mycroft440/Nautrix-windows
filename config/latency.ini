# Nautrix low-latency browser profile. Every switch is measurable/reversible.
enable_happy_eyeballs_v3=1
enable_priority_preconnect=1
enable_quic=1

# Capture is off during normal browsing; enable on demand for profiling.
enable_netlog=0
enable_startup_trace=0

# Raise only the browser root process one class; avoid REALTIME/HIGH by default.
process_priority=above_normal

# Trading origins kept warm through Chromium's own PreconnectManager.
# The downstream trading-priority patch also uses this list to protect matching
# background tabs from discard and force their renderer/workers to foreground
# priority. Add/remove origins here without rebuilding the browser.
preconnect_origins=https://www.mexc.com,https://api.mexc.com,https://www.binance.com,https://api.binance.com,https://www.bybit.com,https://api.bybit.com,https://www.okx.com,https://www.kraken.com,https://api.kraken.com,https://www.coinbase.com,https://api.coinbase.com,https://www.tradingview.com
